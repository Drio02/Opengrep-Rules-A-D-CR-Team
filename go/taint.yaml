# =====================================================================
# Go - taint mode (dataflow) rules
# ---------------------------------------------------------------------
# Sources: net/http, gorilla/mux, chi, gin, echo, fiber. Request objects
# are matched by TYPE (e.g. ($C : *gin.Context)) so that db.Query(...)
# is not mistaken for c.Query(...).
# =====================================================================
rules:
  - id: go-taint-sqli
    mode: taint
    languages: [go]
    severity: ERROR
    message: >
      User input reaches a raw SQL string (database/sql, sqlx, GORM Raw/Where/
      Order). Use placeholders: db.Query("... WHERE id = $1", id).
    metadata:
      category: security
      cwe: CWE-89
      confidence: HIGH
      ad-impact: flag-leak
    pattern-sources:
      - pattern: '($R : *http.Request).URL.Query()'
      - pattern: '($R : *http.Request).URL.RawQuery'
      - pattern: '($R : *http.Request).URL.Path'
      - pattern: '($R : *http.Request).FormValue(...)'
      - pattern: '($R : *http.Request).PostFormValue(...)'
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Body'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).PathValue(...)'
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      - pattern: '($C : *gin.Context).Query(...)'
      - pattern: '($C : *gin.Context).DefaultQuery(...)'
      - pattern: '($C : *gin.Context).Param(...)'
      - pattern: '($C : *gin.Context).PostForm(...)'
      - pattern: '($C : *gin.Context).DefaultPostForm(...)'
      - pattern: '($C : *gin.Context).GetHeader(...)'
      - pattern: '($C : *gin.Context).Cookie(...)'
      - pattern: '($C : *gin.Context).GetRawData()'
      - pattern: '($C : echo.Context).QueryParam(...)'
      - pattern: '($C : echo.Context).Param(...)'
      - pattern: '($C : echo.Context).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Query(...)'
      - pattern: '($C : *fiber.Ctx).Params(...)'
      - pattern: '($C : *fiber.Ctx).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Body()'
      # structs filled from the request body
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.NewDecoder($BODY).Decode(&$X)
              - pattern: '($C : *gin.Context).ShouldBindJSON(&$X)'
              - pattern: '($C : *gin.Context).BindJSON(&$X)'
              - pattern: '($C : *gin.Context).ShouldBind(&$X)'
              - pattern: '($C : *gin.Context).Bind(&$X)'
              - pattern: '($C : echo.Context).Bind(&$X)'
              - pattern: '($C : *fiber.Ctx).BodyParser(&$X)'
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      - pattern: uuid.Parse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.Query($Q, ...)
              - pattern: $DB.QueryRow($Q, ...)
              - pattern: $DB.Exec($Q, ...)
              - pattern: $DB.Prepare($Q)
              - pattern: $DB.QueryContext($CTX, $Q, ...)
              - pattern: $DB.QueryRowContext($CTX, $Q, ...)
              - pattern: $DB.ExecContext($CTX, $Q, ...)
              - pattern: $DB.PrepareContext($CTX, $Q)
              - pattern: $DB.Select($DST, $Q, ...)
              - pattern: $DB.Get($DST, $Q, ...)
              - pattern: $DB.Queryx($Q, ...)
              - pattern: $DB.Raw($Q, ...)
              - pattern: $DB.Where($Q, ...)
              - pattern: $DB.Order($Q)
              - pattern: $DB.Group($Q)
              - pattern: $DB.Having($Q, ...)
          - pattern-not: '($C : *gin.Context).Query(...)'
          - pattern-not: '($C : *fiber.Ctx).Query(...)'
          - pattern-not: '($C : *gin.Context).Get(...)'
          - focus-metavariable: $Q

  - id: go-taint-command-injection
    mode: taint
    languages: [go]
    severity: ERROR
    message: >
      User input reaches os/exec. With "sh -c" it is full command injection;
      as program name it is RCE; as argument it can still be argument
      injection (--output=/flag). Use fixed binaries and validate args.
    metadata:
      category: security
      cwe: CWE-78
      confidence: HIGH
      ad-impact: rce
    pattern-sources:
      - pattern: '($R : *http.Request).URL.Query()'
      - pattern: '($R : *http.Request).URL.RawQuery'
      - pattern: '($R : *http.Request).URL.Path'
      - pattern: '($R : *http.Request).FormValue(...)'
      - pattern: '($R : *http.Request).PostFormValue(...)'
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Body'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).PathValue(...)'
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      - pattern: '($C : *gin.Context).Query(...)'
      - pattern: '($C : *gin.Context).DefaultQuery(...)'
      - pattern: '($C : *gin.Context).Param(...)'
      - pattern: '($C : *gin.Context).PostForm(...)'
      - pattern: '($C : *gin.Context).DefaultPostForm(...)'
      - pattern: '($C : *gin.Context).GetHeader(...)'
      - pattern: '($C : *gin.Context).Cookie(...)'
      - pattern: '($C : *gin.Context).GetRawData()'
      - pattern: '($C : echo.Context).QueryParam(...)'
      - pattern: '($C : echo.Context).Param(...)'
      - pattern: '($C : echo.Context).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Query(...)'
      - pattern: '($C : *fiber.Ctx).Params(...)'
      - pattern: '($C : *fiber.Ctx).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Body()'
      # structs filled from the request body
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.NewDecoder($BODY).Decode(&$X)
              - pattern: '($C : *gin.Context).ShouldBindJSON(&$X)'
              - pattern: '($C : *gin.Context).BindJSON(&$X)'
              - pattern: '($C : *gin.Context).ShouldBind(&$X)'
              - pattern: '($C : *gin.Context).Bind(&$X)'
              - pattern: '($C : echo.Context).Bind(&$X)'
              - pattern: '($C : *fiber.Ctx).BodyParser(&$X)'
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: strconv.Atoi(...)
      - pattern: strconv.ParseInt(...)
      - pattern: strconv.ParseUint(...)
      - pattern: strconv.ParseFloat(...)
      - pattern: strconv.ParseBool(...)
      - pattern: uuid.Parse(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: exec.Command($SH, "-c", $X, ...)
              - pattern: exec.CommandContext($CTX, $SH, "-c", $X, ...)
              - pattern: exec.Command($X, ...)
              - pattern: exec.CommandContext($CTX, $X, ...)
              - pattern: syscall.Exec($X, ...)
          - focus-metavariable: $X

  - id: go-taint-path-traversal
    mode: taint
    languages: [go]
    severity: ERROR
    message: >
      User input reaches a filesystem path. filepath.Join and filepath.Clean
      do NOT stop "../" on relative input. Use filepath.Base, or
      filepath.Clean("/"+p) then join, and verify the prefix.
    metadata:
      category: security
      cwe: CWE-22
      confidence: MEDIUM
      ad-impact: flag-leak
    pattern-sources:
      - pattern: '($R : *http.Request).URL.Query()'
      - pattern: '($R : *http.Request).URL.RawQuery'
      - pattern: '($R : *http.Request).URL.Path'
      - pattern: '($R : *http.Request).FormValue(...)'
      - pattern: '($R : *http.Request).PostFormValue(...)'
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Body'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).PathValue(...)'
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      - pattern: '($C : *gin.Context).Query(...)'
      - pattern: '($C : *gin.Context).DefaultQuery(...)'
      - pattern: '($C : *gin.Context).Param(...)'
      - pattern: '($C : *gin.Context).PostForm(...)'
      - pattern: '($C : *gin.Context).DefaultPostForm(...)'
      - pattern: '($C : *gin.Context).GetHeader(...)'
      - pattern: '($C : *gin.Context).Cookie(...)'
      - pattern: '($C : *gin.Context).GetRawData()'
      - pattern: '($C : echo.Context).QueryParam(...)'
      - pattern: '($C : echo.Context).Param(...)'
      - pattern: '($C : echo.Context).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Query(...)'
      - pattern: '($C : *fiber.Ctx).Params(...)'
      - pattern: '($C : *fiber.Ctx).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Body()'
      # structs filled from the request body
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.NewDecoder($BODY).Decode(&$X)
              - pattern: '($C : *gin.Context).ShouldBindJSON(&$X)'
              - pattern: '($C : *gin.Context).BindJSON(&$X)'
              - pattern: '($C : *gin.Context).ShouldBind(&$X)'
              - pattern: '($C : *gin.Context).Bind(&$X)'
              - pattern: '($C : echo.Context).Bind(&$X)'
              - pattern: '($C : *fiber.Ctx).BodyParser(&$X)'
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - pattern: filepath.Clean("/" + $X)
      - pattern: path.Clean("/" + $X)
      - pattern: strconv.Atoi(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($P)
              - pattern: os.OpenFile($P, ...)
              - pattern: os.ReadFile($P)
              - pattern: ioutil.ReadFile($P)
              - pattern: os.Create($P)
              - pattern: os.WriteFile($P, ...)
              - pattern: ioutil.WriteFile($P, ...)
              - pattern: os.Remove($P)
              - pattern: os.RemoveAll($P)
              - pattern: os.ReadDir($P)
              - pattern: os.Mkdir($P, ...)
              - pattern: os.MkdirAll($P, ...)
              - pattern: os.Rename($P, ...)
              - pattern: http.ServeFile($W, $R, $P)
              - pattern: '($C : *gin.Context).File($P)'
              - pattern: '($C : *gin.Context).FileAttachment($P, ...)'
              - pattern: '($C : *gin.Context).SaveUploadedFile($F, $P)'
              - pattern: '($C : echo.Context).File($P)'
              - pattern: '($C : echo.Context).Attachment($P, ...)'
              - pattern: '($C : *fiber.Ctx).SendFile($P, ...)'
              - pattern: '($C : *fiber.Ctx).SaveFile($F, $P)'
          - focus-metavariable: $P

  - id: go-taint-ssrf
    mode: taint
    languages: [go]
    severity: WARNING
    message: >
      User input controls the URL of an outgoing HTTP request. Allowlist the
