          - focus-metavariable: $U

  - id: go-taint-xss
    mode: taint
    languages: [go]
    severity: WARNING
    message: >
      User input written to the HTTP response without HTML escaping
      (fmt.Fprintf/Write/template.HTML). Reflected XSS against the checker
      bot. Use html/template with normal string values.
    metadata:
      category: security
      cwe: CWE-79
      confidence: LOW
      ad-impact: session-theft
    pattern-sources:
      - pattern: '($R : *http.Request).URL.Query()'
      - pattern: '($R : *http.Request).URL.RawQuery'
      - pattern: '($R : *http.Request).URL.Path'
      - pattern: '($R : *http.Request).FormValue(...)'
      - pattern: '($R : *http.Request).PostFormValue(...)'
      - pattern: '($R : *http.Request).Form'
      - pattern: '($R : *http.Request).PostForm'
      - pattern: '($R : *http.Request).Body'
      - pattern: '($R : *http.Request).Header'
      - pattern: '($R : *http.Request).Cookie(...)'
      - pattern: '($R : *http.Request).PathValue(...)'
      - pattern: mux.Vars(...)
      - pattern: chi.URLParam(...)
      - pattern: '($C : *gin.Context).Query(...)'
      - pattern: '($C : *gin.Context).DefaultQuery(...)'
      - pattern: '($C : *gin.Context).Param(...)'
      - pattern: '($C : *gin.Context).PostForm(...)'
      - pattern: '($C : *gin.Context).DefaultPostForm(...)'
      - pattern: '($C : *gin.Context).GetHeader(...)'
      - pattern: '($C : *gin.Context).Cookie(...)'
      - pattern: '($C : *gin.Context).GetRawData()'
      - pattern: '($C : echo.Context).QueryParam(...)'
      - pattern: '($C : echo.Context).Param(...)'
      - pattern: '($C : echo.Context).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Query(...)'
      - pattern: '($C : *fiber.Ctx).Params(...)'
      - pattern: '($C : *fiber.Ctx).FormValue(...)'
      - pattern: '($C : *fiber.Ctx).Body()'
      # structs filled from the request body
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.NewDecoder($BODY).Decode(&$X)
              - pattern: '($C : *gin.Context).ShouldBindJSON(&$X)'
              - pattern: '($C : *gin.Context).BindJSON(&$X)'
              - pattern: '($C : *gin.Context).ShouldBind(&$X)'
              - pattern: '($C : *gin.Context).Bind(&$X)'
              - pattern: '($C : echo.Context).Bind(&$X)'
              - pattern: '($C : *fiber.Ctx).BodyParser(&$X)'
          - focus-metavariable: $X
    pattern-sanitizers:
      - pattern: html.EscapeString(...)
      - pattern: template.HTMLEscapeString(...)
      - pattern: url.QueryEscape(...)
      - pattern: strconv.Atoi(...)
      # file contents are not attacker-controlled HTML just because the path was
      - pattern: os.ReadFile(...)
      - pattern: ioutil.ReadFile(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: template.HTML($X)
              - pattern: template.JS($X)
              - pattern: template.URL($X)
              - pattern: 'fmt.Fprintf(($W : http.ResponseWriter), $X, ...)'
              - pattern: 'fmt.Fprintf(($W : http.ResponseWriter), $FMT, ..., $X, ...)'
              - pattern: 'fmt.Fprint(($W : http.ResponseWriter), ..., $X, ...)'
              - pattern: 'io.WriteString(($W : http.ResponseWriter), $X)'
              - pattern: '($W : http.ResponseWriter).Write($X)'
              - pattern: '($C : *gin.Context).Data($CODE, $CT, $X)'
              - pattern: '($C : echo.Context).HTML($CODE, $X)'
          - focus-metavariable: $X

