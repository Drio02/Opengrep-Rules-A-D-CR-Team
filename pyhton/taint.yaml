# =====================================================================
# Python - taint mode (dataflow) rules
# ---------------------------------------------------------------------
# The syntactic rules in backend.yaml / python.yaml only fire when the
# dangerous call receives an f-string or a literal concatenation in the
# SAME expression. Real services usually build the value in a variable
# first:   q = "SELECT ... " + name ; cur.execute(q)
# These taint rules follow user input (Flask, Django, FastAPI) through
# assignments, string building and helper calls until it reaches a sink.
#
# Run with --taint-intrafile to also follow data across functions of the
# same file.
# =====================================================================
rules:
  # -------------------------------------------------------------------
  # SQL injection
  # -------------------------------------------------------------------
  - id: py-taint-sqli
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      User input reaches a raw SQL query (execute/raw/text). Use bound
      parameters: cur.execute("... WHERE id = ?", (value,)).
    metadata:
      category: security
      cwe: CWE-89
      confidence: HIGH
      ad-impact: flag-leak
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.cookies
          - pattern: request.headers
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.COOKIES
          - pattern: request.body
          - pattern: request.META
          - pattern: request.query_params
          - pattern: request.path_params
          - pattern: await request.json()
          - pattern: await request.form()
          - pattern: await request.body()
      # Flask / FastAPI path and query parameters bound as handler arguments
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              async def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
    pattern-sanitizers:
      - pattern: int(...)
      - pattern: float(...)
      - pattern: uuid.UUID(...)
      - pattern: bool(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($Q, ...)
              - pattern: $CUR.executemany($Q, ...)
              - pattern: $CUR.executescript($Q)
              - pattern: $M.objects.raw($Q, ...)
              - pattern: $M.objects.extra(..., where=$Q, ...)
              - pattern: sqlalchemy.text($Q)
              - pattern: text($Q)
              - pattern: $DB.engine.execute($Q, ...)
              - pattern: pandas.read_sql($Q, ...)
          - focus-metavariable: $Q

  # -------------------------------------------------------------------
  # NoSQL injection (pymongo / motor)
  # -------------------------------------------------------------------
  - id: py-taint-nosqli
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      User-controlled object used as a MongoDB filter. A JSON body like
      {"password": {"$ne": null}} bypasses the check; "$where" runs JS.
      Cast every field to str/int before building the query.
    metadata:
      category: security
      cwe: CWE-943
      confidence: MEDIUM
      ad-impact: auth-bypass
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.cookies
          - pattern: request.headers
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.COOKIES
          - pattern: request.body
          - pattern: request.META
          - pattern: request.query_params
          - pattern: request.path_params
          - pattern: await request.json()
          - pattern: await request.form()
          - pattern: await request.body()
      # Flask / FastAPI path and query parameters bound as handler arguments
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              async def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
    pattern-sanitizers:
      - pattern: str(...)
      - pattern: int(...)
      - pattern: bson.ObjectId(...)
      - pattern: ObjectId(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $COL.find($Q, ...)
              - pattern: $COL.find_one($Q, ...)
              - pattern: $COL.find_one_and_update($Q, ...)
              - pattern: $COL.update_one($Q, ...)
              - pattern: $COL.update_many($Q, ...)
              - pattern: $COL.delete_one($Q, ...)
              - pattern: $COL.delete_many($Q, ...)
              - pattern: $COL.count_documents($Q, ...)
              - pattern: $COL.aggregate($Q, ...)
          - focus-metavariable: $Q

