              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              async def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
    pattern-sanitizers:
      - pattern: shlex.quote(...)
      - pattern: pipes.quote(...)
      - pattern: int(...)
    pattern-sinks:
      - pattern: os.system(...)
      - pattern: os.popen(...)
      - pattern: commands.getoutput(...)
      - pattern: subprocess.getoutput(...)
      - pattern: subprocess.getstatusoutput(...)
      - patterns:
          - pattern-either:
              - pattern: subprocess.$F($CMD, ..., shell=True, ...)
              - pattern: asyncio.create_subprocess_shell($CMD, ...)
          - focus-metavariable: $CMD

