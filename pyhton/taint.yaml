  # -------------------------------------------------------------------
  # Path traversal / arbitrary file read-write
  # -------------------------------------------------------------------
  - id: py-taint-path-traversal
    mode: taint
    languages: [python]
    severity: ERROR
    message: >
      User input reaches a filesystem path. "../" or an absolute path
      (os.path.join ignores everything before it) escapes the base dir.
      Use secure_filename()/os.path.basename() and check the resolved
      path with Path.is_relative_to(base).
    metadata:
      category: security
      cwe: CWE-22
      confidence: MEDIUM
      ad-impact: flag-leak
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.cookies
          - pattern: request.headers
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.COOKIES
          - pattern: request.body
          - pattern: request.META
          - pattern: request.query_params
          - pattern: request.path_params
          - pattern: await request.json()
          - pattern: await request.form()
          - pattern: await request.body()
      # Flask / FastAPI path and query parameters bound as handler arguments
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
      - patterns:
          - pattern-inside: |
              @$APP.$ROUTE(...)
              async def $FUNC(..., $PARAM, ...):
                  ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: ^(route|get|post|put|patch|delete|api_route|websocket)$
          - pattern: $PARAM
    pattern-sanitizers:
      - pattern: secure_filename(...)
      - pattern: werkzeug.utils.secure_filename(...)
      - pattern: os.path.basename(...)
      - pattern: int(...)
      - pattern: safe_join(...)
      - pattern: werkzeug.security.safe_join(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($P, ...)
              - pattern: io.open($P, ...)
              - pattern: send_file($P, ...)
              - pattern: flask.send_file($P, ...)
              - pattern: send_from_directory($D, $P, ...)
              - pattern: FileResponse($P, ...)
              - pattern: os.remove($P)
              - pattern: os.unlink($P)
              - pattern: os.rename($P, ...)
              - pattern: os.listdir($P)
              - pattern: shutil.rmtree($P, ...)
              - pattern: shutil.copy($P, ...)
              - pattern: shutil.copyfile($P, ...)
              - pattern: shutil.move($P, ...)
              - pattern: pathlib.Path($P)
              - pattern: Path($P)
              - pattern: $BASE / $P
          - focus-metavariable: $P

