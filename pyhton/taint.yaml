              - pattern: django.template.Template($T, ...)
          - focus-metavariable: $T

  # -------------------------------------------------------------------
  # Python format-string injection
  # -------------------------------------------------------------------
  - id: py-taint-format-string-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: >
      User input is used as the FORMAT string of str.format(). Payloads like
      "{user.__class__.__init__.__globals__[SECRET_KEY]}" leak globals,
      config and flags. Never call .format() on user-controlled text.
    metadata:
      category: security
      cwe: CWE-134
      confidence: MEDIUM
      ad-impact: flag-leak
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
