  # -------------------------------------------------------------------
  # Regex injection / ReDoS
  # -------------------------------------------------------------------
  - id: py-taint-regex-injection
    mode: taint
    languages: [python]
    severity: WARNING
    message: >
      User input is compiled as a regular expression. Enables ReDoS (service
      goes down = SLA loss) and oracle attacks (".*" matches every secret).
      Escape with re.escape().
    metadata:
      category: security
      cwe: CWE-1333
      confidence: MEDIUM
      ad-impact: dos
    pattern-sources:
      - pattern-either:
          - pattern: flask.request.$ATTR
          - pattern: request.args
          - pattern: request.form
          - pattern: request.values
          - pattern: request.json
          - pattern: request.data
          - pattern: request.cookies
          - pattern: request.headers
          - pattern: request.files
          - pattern: request.get_json(...)
          - pattern: request.get_data(...)
          - pattern: request.GET
          - pattern: request.POST
          - pattern: request.COOKIES
          - pattern: request.body
