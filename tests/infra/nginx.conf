server {
    listen 80;
    # ruleid: nginx-alias-traversal
    location /static { alias /srv/app/static/; }
    # ok: nginx-alias-traversal
    location /media/ { alias /srv/app/media/; }
    # ruleid: nginx-autoindex-on
    location /uploads/ { root /srv; autoindex on; }
    location /old {
        # ruleid: nginx-crlf-injection-uri
        return 302 https://$host$uri;
    }
    location / {
        proxy_pass http://app:8080;
        # ruleid: nginx-internal-trusted-header
        proxy_set_header X-Real-IP $http_x_forwarded_for;
    }
    location /proxy {
        # ruleid: nginx-proxy-pass-user-controlled
        proxy_pass http://$arg_host;
    }
}
