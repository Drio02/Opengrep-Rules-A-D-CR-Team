      bypass. Use parse_str($s, $out) and read keys explicitly.
    metadata:
      category: security
      cwe: CWE-621
      confidence: HIGH
      ad-impact: auth-bypass
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
