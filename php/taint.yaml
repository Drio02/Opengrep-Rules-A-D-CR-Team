  - id: php-taint-upload-filename
    mode: taint
    languages: [php]
    severity: ERROR
    message: >
      Uploaded file stored using the client-supplied name. Upload shell.php
      (or .phtml/.phar/.htaccess) into the web root -> RCE. Generate the
      name server-side (bin2hex(random_bytes(16))) and allowlist extensions.
    metadata:
      category: security
      cwe: CWE-434
      confidence: HIGH
      ad-impact: rce
    pattern-sources:
      - pattern: $_FILES[$K]['name']
      - pattern: $_FILES[$K]["name"]
      - pattern: $FILE->getClientOriginalName()
      - pattern: $FILE->getClientOriginalExtension()
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: move_uploaded_file($TMP, $DEST)
              - pattern: copy($TMP, $DEST)
              - pattern: file_put_contents($DEST, ...)
              - pattern: $FILE->move($DIR, $DEST)
              - pattern: $FILE->storeAs($DIR, $DEST, ...)
          - focus-metavariable: $DEST
