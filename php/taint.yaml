      - pattern: $request->input(...)
      - pattern: $request->get(...)
      - pattern: $request->query(...)
      - pattern: $request->post(...)
      - pattern: $request->all(...)
      - pattern: $request->cookie(...)
      - pattern: $request->header(...)
      - pattern: $request->getContent(...)
      - pattern: $request->query->get(...)
      - pattern: $request->request->get(...)
      - pattern: $request->cookies->get(...)
      - pattern: $request->headers->get(...)
      - pattern: request(...)
      - pattern: Request::input(...)
      - pattern: Request::get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: curl_init($U)
              - pattern: curl_setopt($CH, CURLOPT_URL, $U)
              - pattern: get_headers($U, ...)
              - pattern: $CLIENT->request($M, $U, ...)
              - pattern: $CLIENT->get($U, ...)
              - pattern: Http::get($U, ...)
              - pattern: Http::post($U, ...)
          - focus-metavariable: $U

  - id: php-taint-deserialization
    mode: taint
    languages: [php]
    severity: ERROR
    message: >
      User input reaches unserialize(). Object injection -> POP chain (magic
      methods __wakeup/__destruct/__toString) -> RCE or file write. Use
      json_decode, or unserialize($x, ['allowed_classes' => false]).
    metadata:
      category: security
      cwe: CWE-502
      confidence: HIGH
      ad-impact: rce
    pattern-sources:
      - pattern: $_GET
      - pattern: $_POST
      - pattern: $_REQUEST
      - pattern: $_COOKIE
      - pattern: $_FILES
      - pattern: $_SERVER['HTTP_USER_AGENT']
      - pattern: $_SERVER['HTTP_REFERER']
      - pattern: $_SERVER['QUERY_STRING']
      - pattern: $_SERVER['REQUEST_URI']
      - pattern: $_SERVER['PHP_SELF']
      - pattern: $_SERVER['HTTP_X_FORWARDED_FOR']
      - pattern: file_get_contents('php://input')
      - pattern: getallheaders()
      - pattern: $request->input(...)
      - pattern: $request->get(...)
      - pattern: $request->query(...)
      - pattern: $request->post(...)
      - pattern: $request->all(...)
      - pattern: $request->cookie(...)
      - pattern: $request->header(...)
      - pattern: $request->getContent(...)
      - pattern: $request->query->get(...)
      - pattern: $request->request->get(...)
      - pattern: $request->cookies->get(...)
      - pattern: $request->headers->get(...)
      - pattern: request(...)
      - pattern: Request::input(...)
      - pattern: Request::get(...)
    pattern-sinks:
      - patterns:
          - pattern: unserialize($D, ...)
          - pattern-not: "unserialize($D, ['allowed_classes' => false])"
          - pattern-not: "unserialize($D, array('allowed_classes' => false))"
          - focus-metavariable: $D

