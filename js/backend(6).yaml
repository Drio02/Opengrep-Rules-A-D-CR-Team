rules:
- id: js-sqli-template-literal
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: SQL construida con template literal / concat. Usa parametros (?, $1) o query builders.
  metadata:
    category: security
    cwe: CWE-89
    confidence: HIGH
  pattern-either:
  - pattern: $DB.query(`... ${$X} ...`)
  - pattern: $DB.query($A + $B)
  - pattern: $DB.execute(`... ${$X} ...`)
  - pattern: connection.query(`... ${$X} ...`)
  - pattern: sequelize.query(`... ${$X} ...`)
- id: js-sqli-mongo-where
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: Mongo $where con codigo dinamico = NoSQL/JS injection.
  metadata:
    category: security
    cwe: CWE-943
    confidence: HIGH
  pattern-either:
  - pattern: '$M.find({ $$where: $X })'
  - pattern: '$M.findOne({ $$where: $X })'
- id: js-command-injection
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: exec/execSync con string dinamico. Usa execFile con array de args.
  metadata:
    category: security
    cwe: CWE-78
    confidence: HIGH
  pattern-either:
  - pattern: child_process.exec(`... ${$X} ...`, ...)
  - pattern: child_process.execSync(`... ${$X} ...`, ...)
  - pattern: exec(`... ${$X} ...`, ...)
  - pattern: execSync(`... ${$X} ...`, ...)
  - pattern: child_process.exec($A + $B, ...)
- id: js-path-traversal
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: fs con path construido a partir de request. Verifica path.resolve + startsWith(basedir).
  metadata:
    category: security
    cwe: CWE-22
    confidence: LOW
  pattern-either:
  - pattern: fs.readFile(path.join($BASE, req.$P.$K), ...)
  - pattern: fs.readFileSync(path.join($BASE, req.$P.$K))
  - pattern: fs.createReadStream(path.join($BASE, req.$P.$K))
  - pattern: res.sendFile(path.join($BASE, req.$P.$K))
  - pattern: fs.readFile(`... ${req.$P.$K} ...`, ...)
- id: js-ssrf
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: HTTP client con URL desde req.*. Whitelist host, bloquea rangos privados/link-local/file://.
  metadata:
    category: security
    cwe: CWE-918
    confidence: MEDIUM
  pattern-either:
  - pattern: axios.get(req.$P.$K)
  - pattern: axios.post(req.$P.$K)
  - pattern: fetch(req.$P.$K)
  - pattern: fetch(`... ${req.$P.$K} ...`)
  - pattern: http.get(req.$P.$K, ...)
  - pattern: request(req.$P.$K, ...)
- id: js-unsafe-deserialization
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: node-serialize.unserialize / vm2 / eval(JSON) sobre input no confiable = RCE.
  metadata:
    category: security
    cwe: CWE-502
    confidence: HIGH
  pattern-either:
  - pattern: serialize.unserialize($X)
  - pattern: require("node-serialize").unserialize($X)
  - pattern: vm.runInNewContext($X, ...)
  - pattern: vm.runInThisContext($X, ...)
- id: js-eval-function
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: eval/Function con string dinamico = RCE en Node / XSS+RCE en cliente.
  metadata:
    category: security
    cwe: CWE-95
    confidence: HIGH
  pattern-either:
  - pattern: eval($X)
  - pattern: new Function($X)
  - pattern: setTimeout($X, ...)
  - pattern: setInterval($X, ...)
- id: js-jwt-no-verify
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: jwt.decode() NO verifica firma. Usa jwt.verify(token, secret).
  metadata:
    category: security
    cwe: CWE-347
    confidence: HIGH
  pattern-either:
  - pattern: jwt.decode($T)
  - pattern: jsonwebtoken.decode($T)
- id: js-tls-verification-disabled
  languages:
  - javascript
  - typescript
  severity: ERROR
  message: rejectUnauthorized:false o NODE_TLS_REJECT_UNAUTHORIZED=0. MITM trivial.
  metadata:
    category: security
    cwe: CWE-295
    confidence: HIGH
  pattern-either:
  - pattern: '{rejectUnauthorized: false}'
  - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = "0"
  - pattern: process.env.NODE_TLS_REJECT_UNAUTHORIZED = 0
- id: js-hardcoded-secret
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Constante con pinta de secreto/token asignada a string literal.
  metadata:
    category: security
    cwe: CWE-798
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: const $N = "..."
    - pattern: let $N = "..."
    - pattern: var $N = "..."
  - metavariable-regex:
      metavariable: $N
      regex: (?i)^(SECRET|JWT|TOKEN|PASSWORD|API_?KEY|ACCESS_?KEY|.*_SECRET|.*_KEY|.*_TOKEN|.*_PASSWORD)$
- id: js-idor-candidate
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: 'CANDIDATO IDOR: lookup con id de req.params/query. Verifica owner-check antes de responder.'
  metadata:
    category: security
    cwe: CWE-639
    confidence: LOW
  pattern-either:
  - pattern: $M.findById(req.params.$K)
  - pattern: $M.findByPk(req.params.$K)
  - pattern: '$M.findOne({ id: req.params.$K })'
  - pattern: $M.findById(req.query.$K)
  - pattern: $M.findByPk(req.query.$K)
- id: js-xss-res-send-user
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: res.send/res.write con contenido dinamico del request y sin content-type JSON. Puede ser XSS reflejado.
  metadata:
    category: security
    cwe: CWE-79
    confidence: LOW
  pattern-either:
  - pattern: res.send(req.query.$K)
  - pattern: res.send(req.params.$K)
  - pattern: res.send(`... ${req.query.$K} ...`)
  - pattern: res.write(req.query.$K)
- id: js-prototype-pollution
  languages:
  - javascript
  - typescript
  severity: WARNING
  message: Merge/assign profundo con input no confiable = prototype pollution.
  metadata:
    category: security
    cwe: CWE-1321
    confidence: LOW
  pattern-either:
  - pattern: _.merge($X, req.body)
  - pattern: _.mergeWith($X, req.body, ...)
  - pattern: Object.assign($X, req.body)
  - pattern: $X[$K][$K2] = $V
